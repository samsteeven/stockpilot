name: stockpilot

# Développement local : PostgreSQL et Redis, données en mémoire (tmpfs) pour ne pas grossir le disque de Docker.
#   docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: stockpilot-postgres
    environment:
      # Propriétaire des tables : sert aux migrations seulement. L'application utilise stockpilot_app (voir init).
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
      POSTGRES_DB: stockpilot
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5437}:5432'
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockpilot -d stockpilot']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6-alpine
    container_name: stockpilot-redis
    # Les jobs BullMQ survivent à un redémarrage de Redis en production (AOF) ; ici, tout est en mémoire.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Faux serveur SMTP : les e-mails aux clients arrivent ici, visibles sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: stockpilot-mailpit
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

  # Observabilité, à la demande : docker compose --profile observabilite up -d
  # Prometheus (http://localhost:9090) lit les métriques de l'API (9464) et du worker (9465) lancés sur l'hôte ;
  # Grafana (http://localhost:3001, sans connexion en local) affiche le tableau de bord StockPilot.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: stockpilot-prometheus
    profiles: [observabilite]
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.path=/prometheus',
      ]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090'
    # Prometheus ne tourne pas en root : son répertoire de données en mémoire doit lui être accessible.
    tmpfs:
      - /prometheus:mode=1777
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:13.2.4
    container_name: stockpilot-grafana
    profiles: [observabilite]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:3001:3000'
    tmpfs:
      - /var/lib/grafana:mode=1777
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/dashboards:ro
