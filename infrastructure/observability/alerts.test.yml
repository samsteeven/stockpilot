# Tests des alertes : promtool test rules alerts.test.yml (dans la CI). Chaque alerte se déclenche quand il le
# faut, et pas avant son délai.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="worker"}'
        values: '1 1 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: StockPilotProcessusMuet
        exp_alerts: []
      - eval_time: 4m
        alertname: StockPilotProcessusMuet
        exp_alerts:
          - exp_labels: { severity: critique, job: worker }
            exp_annotations:
              summary: 'worker ne répond plus à Prometheus depuis 1 min'
              description: 'Processus arrêté ou port de métriques injoignable. Voir les journaux du service.'

  - interval: 1m
    input_series:
      - series: 'stockpilot_outbox_oldest_age_seconds{service="worker"}'
        values: '0 30 90 150 210 270'
    alert_rule_test:
      - eval_time: 3m
        alertname: StockPilotOutboxEnRetard
        exp_alerts: []
      - eval_time: 5m
        alertname: StockPilotOutboxEnRetard
        exp_alerts:
          - exp_labels: { severity: critique, service: worker }
            exp_annotations:
              summary: 'Un événement attend sa publication depuis plus d’une minute'
              description: 'Relais du worker arrêté ou Redis injoignable : expéditions et e-mails ne partent plus.'

  - interval: 1m
    # 100 requêtes par minute, dont 5 en erreur à partir de la 2e minute : 5 % de 5xx.
    input_series:
      - series: 'stockpilot_http_request_duration_seconds_count{route="/api/v1/orders",status="201"}'
        values: '0+95x15'
      - series: 'stockpilot_http_request_duration_seconds_count{route="/api/v1/orders",status="500"}'
        values: '0+5x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: StockPilotErreursServeur
        exp_alerts: []
      - eval_time: 12m
        alertname: StockPilotErreursServeur
        exp_alerts:
          - exp_labels: { severity: critique }
            exp_annotations:
              summary: 'Plus de 2 % de réponses 5xx sur 5 min'
              description: 'Chercher les lignes de niveau error (même X-Request-Id que la réponse).'

  - interval: 1m
    # 1 % d'erreurs : en dessous du seuil, pas d'alerte.
    input_series:
      - series: 'stockpilot_http_request_duration_seconds_count{route="/api/v1/orders",status="201"}'
        values: '0+99x15'
      - series: 'stockpilot_http_request_duration_seconds_count{route="/api/v1/orders",status="500"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: StockPilotErreursServeur
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'stockpilot_queue_jobs{queue="domain-events",state="failed"}'
        values: '0 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 10m
        alertname: StockPilotJobsEnEchecDefinitif
        exp_alerts: []
      - eval_time: 17m
        alertname: StockPilotJobsEnEchecDefinitif
        exp_alerts:
          - exp_labels:
              { severity: avertissement, queue: domain-events, state: failed }
            exp_annotations:
              summary: 'File domain-events : 2 job(s) en échec définitif'
              description: 'Tous les essais sont épuisés : à examiner et rejouer à la main.'
